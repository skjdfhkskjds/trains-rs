[build]
target = "armv7a-none-eabi"

[alias]
image = "run --quiet --manifest-path xtask/Cargo.toml --target x86_64-unknown-linux-gnu"
qemu = "run --release"

[target.armv7a-none-eabi]
runner = "scripts/qemu.sh"
rustflags = [
    "-C", "link-arg=-Tcrates/kernel/linker.ld",
    "-C", "link-arg=--gc-sections",
]
